name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Lint and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          php --version
          find . -type f -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Build production config
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          HOSTINGER_DB_HOST: ${{ secrets.HOSTINGER_DB_HOST }}
          HOSTINGER_DB_NAME: ${{ secrets.HOSTINGER_DB_NAME }}
          HOSTINGER_DB_USER: ${{ secrets.HOSTINGER_DB_USER }}
          HOSTINGER_DB_PASSWORD: ${{ secrets.HOSTINGER_DB_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_DAILY_LIMIT: ${{ secrets.AI_DAILY_LIMIT }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          PLAUSIBLE_DOMAIN: ${{ secrets.PLAUSIBLE_DOMAIN }}
        run: |
          if [ -n "$HOSTINGER_DB_NAME" ]; then
            php -r '
            $adminPasswordHash = getenv("ADMIN_PASSWORD_HASH");
            if (!$adminPasswordHash && getenv("ADMIN_PASSWORD")) {
                $adminPasswordHash = password_hash(getenv("ADMIN_PASSWORD"), PASSWORD_DEFAULT);
            }
            $config = [
                "app_env" => "production",
                "app_url" => getenv("PRODUCTION_URL") ?: "https://moneytidecn.avanturadeals.com",
                "db" => [
                    "host" => getenv("HOSTINGER_DB_HOST") ?: "localhost",
                    "name" => getenv("HOSTINGER_DB_NAME"),
                    "user" => getenv("HOSTINGER_DB_USER"),
                    "pass" => getenv("HOSTINGER_DB_PASSWORD"),
                    "charset" => "utf8mb4",
                ],
                "admin" => [
                    "email" => getenv("ADMIN_EMAIL"),
                    "password_hash" => $adminPasswordHash,
                ],
                "ai" => [
                    "provider" => getenv("AI_PROVIDER") ?: "ollama_cloud",
                    "api_key" => getenv("OPENAI_API_KEY"),
                    "ollama_api_key" => getenv("OLLAMA_API_KEY"),
                    "model" => getenv("OLLAMA_MODEL") ?: getenv("OPENAI_MODEL") ?: "gemma4:31b-cloud",
                    "daily_limit" => getenv("AI_DAILY_LIMIT") ?: 10,
                ],
                "analytics" => [
                    "ga_measurement_id" => getenv("GA_MEASUREMENT_ID"),
                    "plausible_domain" => getenv("PLAUSIBLE_DOMAIN"),
                ],
            ];
            file_put_contents("public/config.php", "<?php\n\ndeclare(strict_types=1);\n\nreturn " . var_export($config, true) . ";\n");
            '
          else
            echo "Database secrets are not set; deploying without generated config.php."
          fi

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTPS with lftp
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          PUBLIC_DIR: ${{ secrets.HOSTINGER_PUBLIC_DIR }}
          APP_DIR: ${{ secrets.HOSTINGER_APP_DIR }}
        run: |
          set -e
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ] || [ -z "$PUBLIC_DIR" ] || [ -z "$APP_DIR" ]; then
            echo "FTP secrets are missing; skipping deploy."
            exit 1
          fi
          APP_DIR="${APP_DIR%/}"
          PUBLIC_DIR="${PUBLIC_DIR%/}"
          DEPLOY_SCRIPT="$(mktemp)"
          cat > "$DEPLOY_SCRIPT" <<EOF
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ftp:passive-mode yes
          set ssl:verify-certificate no
          set ssl:check-hostname no
          set cmd:fail-exit yes
          set net:max-retries 5
          set net:reconnect-interval-base 10
          set net:timeout 60
          set mirror:parallel-transfer-count 1
          set mirror:use-pget-n 1
          EOF
          add_put() {
            local file="$1"
            local base=""
            local rel=""
            case "$file" in
              public/*) base="$PUBLIC_DIR"; rel="${file#public/}" ;;
              src/*) base="$APP_DIR/src"; rel="${file#src/}" ;;
              views/*) base="$APP_DIR/views"; rel="${file#views/}" ;;
              *) return 0 ;;
            esac
            local rel_dir
            rel_dir="$(dirname "$rel")"
            local remote_dir="$base"
            if [ "$rel_dir" != "." ]; then
              remote_dir="$base/$rel_dir"
            fi
            printf 'mkdir -p "%s"\n' "$remote_dir" >> "$DEPLOY_SCRIPT"
            printf 'put -O "%s" "%s"\n' "$remote_dir" "$file" >> "$DEPLOY_SCRIPT"
          }
          while IFS= read -r -d '' file; do
            add_put "$file"
          done < <(find public src views -type f -not -path '*/.git/*' -not -name '.DS_Store' -print0)
          cat >> "$DEPLOY_SCRIPT" <<EOF
          bye
          EOF
          timeout 20m lftp -f "$DEPLOY_SCRIPT"

      - name: Verify production homepage
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ -n "$PRODUCTION_URL" ]; then
            curl --fail --silent --show-error --location "$PRODUCTION_URL/health.php"
          else
            echo "PRODUCTION_URL secret is not set; skipping health check."
          fi
