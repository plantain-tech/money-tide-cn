name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Lint and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          php --version
          find . -type f -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Build production config
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          HOSTINGER_DB_HOST: ${{ secrets.HOSTINGER_DB_HOST }}
          HOSTINGER_DB_NAME: ${{ secrets.HOSTINGER_DB_NAME }}
          HOSTINGER_DB_USER: ${{ secrets.HOSTINGER_DB_USER }}
          HOSTINGER_DB_PASSWORD: ${{ secrets.HOSTINGER_DB_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_DAILY_LIMIT: ${{ secrets.AI_DAILY_LIMIT }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          PLAUSIBLE_DOMAIN: ${{ secrets.PLAUSIBLE_DOMAIN }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
        run: |
          if [ -n "$HOSTINGER_DB_NAME" ]; then
            php -r '
            $adminPasswordHash = getenv("ADMIN_PASSWORD_HASH");
            if (!$adminPasswordHash && getenv("ADMIN_PASSWORD")) {
                $adminPasswordHash = password_hash(getenv("ADMIN_PASSWORD"), PASSWORD_DEFAULT);
            }
            $config = [
                "app_env" => "production",
                "app_url" => getenv("PRODUCTION_URL") ?: "https://moneytidecn.avanturadeals.com",
                "db" => [
                    "host" => getenv("HOSTINGER_DB_HOST") ?: "localhost",
                    "name" => getenv("HOSTINGER_DB_NAME"),
                    "user" => getenv("HOSTINGER_DB_USER"),
                    "pass" => getenv("HOSTINGER_DB_PASSWORD"),
                    "charset" => "utf8mb4",
                ],
                "admin" => [
                    "email" => getenv("ADMIN_EMAIL"),
                    "password_hash" => $adminPasswordHash,
                ],
                "ai" => [
                    "provider" => getenv("AI_PROVIDER") ?: "ollama_cloud",
                    "api_key" => getenv("OPENAI_API_KEY"),
                    "ollama_api_key" => getenv("OLLAMA_API_KEY"),
                    "model" => getenv("OLLAMA_MODEL") ?: getenv("OPENAI_MODEL") ?: "gemma4:31b-cloud",
                    "daily_limit" => getenv("AI_DAILY_LIMIT") ?: 10,
                ],
                "analytics" => [
                    "ga_measurement_id" => getenv("GA_MEASUREMENT_ID"),
                    "plausible_domain" => getenv("PLAUSIBLE_DOMAIN"),
                ],
                "email" => [
                    "provider" => getenv("EMAIL_PROVIDER") ?: "log",
                    "api_key" => getenv("EMAIL_API_KEY") ?: "",
                    "from_address" => getenv("EMAIL_FROM_ADDRESS") ?: "",
                    "from_name" => getenv("EMAIL_FROM_NAME") ?: "钱潮 Money Tide",
                    "mailgun_domain" => getenv("MAILGUN_DOMAIN") ?: "",
                ],
                "oauth" => [
                    "google" => [
                        "client_id" => getenv("OAUTH_GOOGLE_CLIENT_ID") ?: "",
                        "client_secret" => getenv("OAUTH_GOOGLE_CLIENT_SECRET") ?: "",
                    ],
                ],
                "security" => [
                    "unsubscribe_secret" => getenv("UNSUBSCRIBE_SECRET") ?: "",
                ],
            ];
            file_put_contents("public/config.php", "<?php\n\ndeclare(strict_types=1);\n\nreturn " . var_export($config, true) . ";\n");
            '
          else
            echo "Database secrets are not set; deploying without generated config.php."
          fi

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTPS with lftp
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          PUBLIC_DIR: ${{ secrets.HOSTINGER_PUBLIC_DIR }}
          APP_DIR: ${{ secrets.HOSTINGER_APP_DIR }}
        run: |
          set -e
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ] || [ -z "$PUBLIC_DIR" ] || [ -z "$APP_DIR" ]; then
            echo "FTP secrets are missing; cannot deploy."
            exit 1
          fi
          # Build the lftp command script (no credentials inside; passed on CLI).
          cat > /tmp/deploy.lftp <<EOF
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ftp:passive-mode yes
          set ssl:verify-certificate no
          set ssl:check-hostname no
          set net:max-retries 4
          set net:reconnect-interval-base 5
          set net:timeout 60
          set mirror:parallel-transfer-count 1
          set mirror:use-pget-n 1
          put -O "$PUBLIC_DIR" public/config.php
          mirror -R --no-perms --parallel=1 --exclude-glob .git* --exclude-glob .DS_Store ./public/ "$PUBLIC_DIR"
          mirror -R --no-perms --parallel=1 --exclude-glob .git* --exclude-glob .DS_Store ./src/ "${APP_DIR}src/"
          mirror -R --no-perms --parallel=1 --exclude-glob .git* --exclude-glob .DS_Store ./views/ "${APP_DIR}views/"
          bye
          EOF
          # Shell-level retry: a fresh lftp process per attempt survives transient
          # FTPS drops better than lftp's own in-session reconnect.
          attempt=1
          max_attempts=3
          until lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" < /tmp/deploy.lftp; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Deploy failed after $attempt attempts."
              exit 1
            fi
            echo "Deploy attempt $attempt failed (transient FTPS issue); retrying in 30s..."
            attempt=$((attempt + 1))
            sleep 30
          done
          echo "Deploy succeeded on attempt $attempt."

      - name: Verify production homepage
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ -n "$PRODUCTION_URL" ]; then
            curl --fail --silent --show-error --location "$PRODUCTION_URL/health.php"
          else
            echo "PRODUCTION_URL secret is not set; skipping health check."
          fi
