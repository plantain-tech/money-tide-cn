name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Lint and deploy production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: PHP syntax check
        run: find . -type f -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Deploy public web root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ${{ secrets.HOSTINGER_PUBLIC_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.DS_Store

      - name: Deploy application source
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./src/
          server-dir: ${{ secrets.HOSTINGER_APP_DIR }}src/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.DS_Store

      - name: Deploy views
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./views/
          server-dir: ${{ secrets.HOSTINGER_APP_DIR }}views/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.DS_Store

      - name: Verify production homepage
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ -n "$PRODUCTION_URL" ]; then
            curl --fail --silent --show-error --location "$PRODUCTION_URL/health.php"
          else
            echo "PRODUCTION_URL secret is not set; skipping health check."
          fi
