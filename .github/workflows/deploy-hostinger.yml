name: CI — PHP lint (+ OPcache flush)

# Deployment is now handled by Hostinger's Git auto-deploy (the server PULLS
# from this repo on push), so this workflow no longer pushes over SSH — that
# removes the fail2ban/SSH-throttle pain entirely. It now just:
#   1. lints every PHP file (so a syntax error never reaches production), and
#   2. best-effort flushes the production OPcache after Hostinger pulls.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Lint PHP + flush OPcache
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check (php -l on all files)
        run: |
          php --version
          find . -type f -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Flush production OPcache after Hostinger auto-deploy
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          URL="${PRODUCTION_URL:-https://moneytidecn.avanturadeals.com}"
          # Give Hostinger's Git webhook a moment to pull the new commit, then ask
          # health.php to flush OPcache so fresh PHP takes effect immediately.
          # Best-effort only — never fail the build if the site is briefly busy.
          echo "Waiting ~40s for Hostinger Git auto-deploy to pull…"
          sleep 40
          for i in 1 2 3; do
            curl --silent --max-time 20 "$URL/health.php?oc=1&nc=$RANDOM$i" || true
            echo ""
            sleep 8
          done
          echo "OPcache flush requested (best-effort). Hostinger Git performs the deploy."
