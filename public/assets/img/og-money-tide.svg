  <text x="110" y="200" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="92" font-weight="900" fill="#111">钱潮</text>
  <text x="110" y="292" font-family="Arial, sans-serif" font-size="78" font-weight="900" fill="#111">Money Tide</text>
